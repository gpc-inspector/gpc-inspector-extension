<!DOCTYPE html>
<!-- SPDX-License-Identifier: GPL-3.0-only -->
<!--
  The store frames: one 1280x800 image per store-shots.mjs entry, store.html?shot=<name>,
  and the 440x280 tile, store.html?tile=small. With no parameter, every frame at half size.

  The popup and the side panel are the real popup.html in an iframe, run by the harness's
  chrome stub over a fixture, at their real size: 420px wide and at most 600px tall, as Chrome
  draws a popup, or the panel at 400px. Everything around them is a plain, fictional page in
  a browser window that carries no browser's brand.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>GPC Inspector store frames</title>
<style>
  :root {
    --band: #12345a; --band-text: #ffffff; --band-label: #c7dbf3;
    --chrome: #e7eaee; --chrome-line: #cdd2d9; --chrome-ink: #5f6670;
    --page: #ffffff; --ink: #1f2328; --muted: #6b7178; --block: #eef0f2; --block-2: #e3e6ea;
    --accent: #185fa5;
  }
  html, body { margin: 0; background: #ffffff; color: var(--ink); color-scheme: light;
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .frame { position: relative; width: 1280px; height: 800px; overflow: hidden; background: var(--page); }

  .band { height: 64px; background: var(--band); color: var(--band-text); display: flex; align-items: center;
    justify-content: space-between; gap: 24px; padding: 0 36px; box-sizing: border-box; }
  .caption { font-size: 23px; font-weight: 600; letter-spacing: -0.01em; white-space: nowrap; }
  .label { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--band-label);
    border: 1px solid rgba(199, 219, 243, 0.55); border-radius: 999px; padding: 5px 12px; white-space: nowrap; }

  .window { position: absolute; top: 64px; left: 0; right: 0; bottom: 0; }
  .toolbar { height: 46px; box-sizing: border-box; background: var(--chrome); border-bottom: 1px solid var(--chrome-line);
    display: flex; align-items: center; gap: 6px; padding: 0 12px; }
  .glyph { width: 30px; height: 30px; display: grid; place-items: center; color: var(--chrome-ink); }
  .glyph svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .omnibox { flex: 1; height: 32px; margin: 0 8px; border-radius: 16px; background: #ffffff; display: flex; align-items: center;
    gap: 8px; padding: 0 14px; font-size: 14px; color: #3d434a; box-shadow: inset 0 0 0 1px #d9dde2; }
  .omnibox svg { width: 14px; height: 14px; fill: none; stroke: var(--chrome-ink); stroke-width: 2; }
  .omnibox .host { color: #1f2328; }
  .ext { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: #d5dbe3; }
  .ext img { width: 20px; height: 20px; }

  .page { position: absolute; top: 46px; left: 0; right: 0; bottom: 0; overflow: hidden; background: var(--page); }
  .has-panel .page { right: 401px; }
  /* The site's own utility bar, in the site's palette: not a browser infobar. */
  .utility { display: flex; gap: 22px; padding: 7px 40px; background: #2b3540; color: #dfe4e9; font-size: 12.5px; }
  .utility .sep { color: #7f8b97; }
  .site-head { display: flex; align-items: center; gap: 28px; padding: 18px 40px; border-bottom: 1px solid #eceef0; }
  .wordmark { font-size: 21px; font-weight: 700; letter-spacing: -0.02em; }
  .wordmark span { color: var(--muted); font-weight: 500; }
  .nav { display: flex; gap: 22px; color: var(--muted); font-size: 14px; }
  .hero { margin: 26px 40px 0; height: 250px; border-radius: 14px; background: linear-gradient(135deg, #dfe7ef, #eef1f4);
    padding: 34px 40px; box-sizing: border-box; }
  .hero h1 { margin: 0; font-size: 34px; line-height: 1.15; letter-spacing: -0.02em; max-width: 520px; }
  .hero p { margin: 12px 0 0; color: var(--muted); font-size: 16px; max-width: 460px; }
  .hero .cta { display: inline-block; margin-top: 22px; padding: 10px 18px; border-radius: 8px; background: #2b3540; color: #fff; font-size: 14px; }
  .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; margin: 24px 40px 0; }
  .card .img { height: 120px; border-radius: 10px; background: var(--block); }
  .card .t { height: 11px; border-radius: 6px; background: var(--block-2); margin-top: 12px; width: 80%; }
  .card .t.s { width: 50%; margin-top: 8px; }
  .article { margin: 30px 40px 0; max-width: 640px; }
  .article .kicker { color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; }
  .article h1 { margin: 8px 0 14px; font-size: 32px; line-height: 1.18; letter-spacing: -0.02em; }
  .article .lede { color: #3a4047; font-size: 17px; line-height: 1.55; }
  .article .img { height: 210px; border-radius: 10px; background: var(--block); margin: 20px 0; }
  .article .line { height: 11px; border-radius: 6px; background: var(--block-2); margin: 12px 0; }

  .popup { position: absolute; top: 50px; right: 14px; width: 420px; height: 600px; border: 0; border-radius: 8px; background: #fff;
    box-shadow: 0 6px 22px rgba(15, 25, 40, 0.24), 0 0 0 1px rgba(15, 25, 40, 0.10); }
  .panel { position: absolute; top: 46px; right: 0; bottom: 0; width: 400px; border-left: 1px solid var(--chrome-line);
    background: #fff; display: flex; flex-direction: column; }
  .panel-head { height: 40px; flex: none; box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding: 0 12px;
    border-bottom: 1px solid #e3e6ea; font-size: 13px; font-weight: 600; color: #2b3138; background: var(--chrome); }
  .panel-head img { width: 16px; height: 16px; }
  .panel-head .x { margin-left: auto; color: var(--chrome-ink); font-weight: 400; font-size: 18px; }
  .panel iframe { flex: 1; width: 400px; border: 0; }

  /* The small promotional tile: no text, the mark and the shape of the popup. */
  .tile { position: relative; width: 440px; height: 280px; overflow: hidden;
    background: radial-gradient(120% 140% at 0% 0%, #2a7bd0 0%, #185fa5 45%, #0f3d6e 100%); }
  .tile .mark { position: absolute; left: 44px; top: 50px; width: 180px; height: 180px; }
  .tile .card { position: absolute; left: 236px; top: 46px; width: 170px; height: 188px; border-radius: 14px; background: #f7f8fa;
    box-shadow: 0 10px 30px rgba(5, 20, 40, 0.35); padding: 16px 14px; box-sizing: border-box; }
  .tile .row { display: flex; align-items: center; gap: 8px; height: 22px; }
  .tile .dot { width: 9px; height: 9px; border-radius: 50%; background: #185fa5; flex: none; }
  .tile .bar { height: 8px; border-radius: 4px; background: #cfd6de; }
  .tile .bar.ink { background: #8a96a3; }
  .tile .bar.amber { background: #c98a2b; }
  .tile .sep { height: 1px; background: #e2e6ea; margin: 8px 0; }
  .tile .big { width: 34px; height: 26px; border-radius: 6px; background: #c98a2b; margin: 6px auto 4px; }

  .sheet { display: flex; flex-wrap: wrap; gap: 24px; padding: 24px; background: #8a8a84; }
  .sheet figure { margin: 0; }
  .sheet figcaption { color: #fff; font-weight: 600; padding: 0 0 6px 2px; }
  .sheet iframe { width: 1280px; height: 800px; border: 0; transform: scale(0.5); transform-origin: 0 0; margin: 0 -640px -400px 0; background: #fff; }
</style>
</head>
<body>
<script type="module">
  import { SHOTS, FRAME } from "./store-shots.mjs";
  import { FIXTURES } from "./fixtures.mjs";

  const params = new URLSearchParams(location.search);
  const shotName = params.get("shot");
  const tile = params.get("tile");

  const ICON = "icons/gpc-on.svg";
  const svg = (d) => `<svg viewBox="0 0 24 24" aria-hidden="true">${d}</svg>`;
  const escape = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

  /** The fictional page behind the popup, by the kind of site its address names. */
  function pageFor(site, noticeShown) {
    const url = new URL(site);
    const name = url.hostname.replace(/^www\./, "");
    const [label] = name.split(".");
    // The site's own confirmation, in the site's utility bar beside its other notices, because
    // the popup reports that the page showed one. California's example wording. Drawn as site
    // content, never as a browser bar, so it cannot read as the extension's own words.
    const promo = { shop: "Free shipping on orders over $50", autos: "Find a dealer near you" }[label] ?? "Sign in";
    const notice = noticeShown
      ? `<div class="utility"><span>${promo}</span><span class="sep">|</span><span>Your privacy choices: Opt-Out Request Honored</span></div>`
      : "";
    const head = (nav) => `<div class="site-head"><div class="wordmark">${label}<span>.example</span></div><div class="nav">${nav.map((n) => `<span>${n}</span>`).join("")}</div></div>`;
    const cards = `<div class="cards">${'<div class="card"><div class="img"></div><div class="t"></div><div class="t s"></div></div>'.repeat(8)}</div>`;
    const kinds = {
      shop: () => head(["New", "Outdoor", "Home", "Kitchen", "Deals"]) +
        `<div class="hero"><h1>Fall gear, ready to ship</h1><p>Jackets, boots and everything for the first cold morning.</p><span class="cta">Shop the season</span></div>` + cards,
      autos: () => head(["Models", "Build yours", "Offers", "Dealers", "Owners"]) +
        `<div class="hero"><h1>The 2027 lineup</h1><p>Compare trims, estimate a payment, and find one near you.</p><span class="cta">Explore models</span></div>` + cards,
      news: () => head(["World", "Business", "Science", "Opinion", "Weather"]) +
        `<div class="article"><div class="kicker">World</div><h1>Harbor report: what the new pier means for the waterfront</h1><div class="lede">A year of construction ends this week. Here is what changes for the people who live and work along the water.</div><div class="img"></div><div class="line"></div><div class="line" style="width:92%"></div><div class="line" style="width:85%"></div></div>`,
      travel: () => head(["Book", "My trips", "Check in", "Deals", "Help"]) +
        `<div class="hero"><h1>Where to next?</h1><p>Search flights, hotels and cars in one place.</p><span class="cta">Search trips</span></div>` + cards,
      recipes: () => head(["Dinners", "Soups", "Baking", "Seasonal", "Collections"]) +
        `<div class="article"><div class="kicker">Soups</div><h1>Roasted winter squash soup</h1><div class="lede">Forty minutes, one pot, and a handful of pantry spices. Serves four.</div><div class="img"></div><div class="line"></div><div class="line" style="width:92%"></div><div class="line" style="width:85%"></div></div>`,
      market: () => head(["Women", "Men", "Kids", "Home", "Weekly deals"]) +
        `<div class="hero"><h1>Weekly deals</h1><p>Prices drop every Thursday on hundreds of everyday items.</p><span class="cta">See the deals</span></div>` + cards,
    };
    return notice + (kinds[label] ?? kinds.shop)();
  }

  function toolbar(site) {
    const url = new URL(site);
    const rest = url.pathname === "/" ? "" : url.pathname;
    return `<div class="toolbar">
      <div class="glyph">${svg('<path d="M15 6l-6 6 6 6"/>')}</div>
      <div class="glyph">${svg('<path d="M9 6l6 6-6 6"/>')}</div>
      <div class="glyph">${svg('<path d="M19 12a7 7 0 1 1-2.05-4.95M19 5v4h-4"/>')}</div>
      <div class="omnibox">${svg('<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>')}<span><span class="host">${escape(url.hostname)}</span>${escape(rest)}</span></div>
      <div class="ext"><img src="${ICON}" alt=""></div>
      <div class="glyph">${svg('<circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/>')}</div>
    </div>`;
  }

  /** Wait for the popup to draw and the chrome stub to open its screen, then scroll as a reader would. */
  function settle(frame, shot, sizeToContent) {
    frame.addEventListener("load", () => {
      setTimeout(() => {
        const doc = frame.contentDocument;
        if (!doc) return;
        // Chrome on macOS draws overlay scrollbars that take no width and show only while
        // scrolling. A browser with classic scrollbars would take 15px from a 420px popup and
        // wrap rows the real one does not.
        const style = doc.createElement("style");
        style.textContent = "* { scrollbar-width: none; }";
        doc.head.append(style);
        if (sizeToContent) {
          // Chrome sizes a popup to its content, up to 600px.
          frame.style.height = `${Math.min(doc.documentElement.scrollHeight, FRAME.popupMaxHeight)}px`;
        }
        if (shot.scrollTo) {
          const [kind, name] = shot.scrollTo.split(/:(.*)/s);
          const target =
            kind === "vendor" ? [...doc.querySelectorAll("#vendors .vrow")].find((r) => r.querySelector(".vname")?.textContent?.trim() === name)
            : kind === "group" ? [...doc.querySelectorAll("#vendors .vgroup-label")].find((g) => g.textContent?.trim() === name)
            : doc.querySelector(shot.scrollTo);
          target?.scrollIntoView({ block: "start" });
        }
        document.body.dataset.ready = "1";
      }, 1600);
    });
  }

  function renderShot(shot) {
    const obs = FIXTURES[shot.fixture]();
    const src = `popup.html?fixture=${shot.fixture}${shot.query}${shot.host === "panel" ? "&host=panel" : ""}`;
    const frame = document.createElement("div");
    frame.className = `frame${shot.host === "panel" ? " has-panel" : ""}`;
    frame.innerHTML = `
      <div class="band"><div class="caption">${escape(shot.caption)}</div><div class="label">Illustrative data</div></div>
      <div class="window">${toolbar(shot.site)}<div class="page">${pageFor(shot.site, obs?.confirmationNotice === "detected")}</div></div>`;
    const win = frame.querySelector(".window");
    const iframe = document.createElement("iframe");
    iframe.src = src;
    if (shot.host === "panel") {
      const panel = document.createElement("div");
      panel.className = "panel";
      panel.innerHTML = `<div class="panel-head"><img src="${ICON}" alt="">GPC Inspector<span class="x">×</span></div>`;
      panel.append(iframe);
      win.append(panel);
      settle(iframe, shot, false);
    } else {
      iframe.className = "popup";
      win.append(iframe);
      settle(iframe, shot, true);
    }
    document.body.append(frame);
  }

  function renderTile() {
    const rows = [
      '<div class="row"><span class="dot"></span><span class="bar ink" style="width:96px"></span></div>',
      '<div class="sep"></div>',
      '<div class="row"><span class="bar" style="width:70px"></span><span class="bar ink" style="width:26px;margin-left:auto"></span></div>',
      '<div class="row"><span class="bar" style="width:84px"></span><span class="bar ink" style="width:26px;margin-left:auto"></span></div>',
      '<div class="sep"></div>',
      '<div class="big"></div>',
      '<div class="row" style="justify-content:center"><span class="bar" style="width:104px"></span></div>',
      '<div class="row"><span class="bar ink" style="width:56px"></span><span class="bar amber" style="width:34px;margin-left:auto"></span></div>',
    ].join("");
    document.body.innerHTML = `<div class="tile">
      <svg class="mark" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4.5 4.5h15v7.5c0 4.8-3.6 7.9-7.5 9.5C8.1 19.9 4.5 16.8 4.5 12z" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-width="1.2" stroke-linejoin="round"/>
        <g fill="none" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round"><circle cx="13" cy="10" r="3.3"/><path d="M10.67 12.33L8 15"/></g>
      </svg>
      <div class="card">${rows}</div>
    </div>`;
    document.body.dataset.ready = "1";
  }

  if (tile === "small") {
    renderTile();
  } else if (shotName) {
    const shot = SHOTS.find((s) => s.name === shotName);
    if (shot) renderShot(shot);
    else document.body.textContent = `No shot named ${shotName}.`;
  } else {
    // Every frame at half size, for review.
    const sheet = document.createElement("div");
    sheet.className = "sheet";
    sheet.innerHTML = [...SHOTS.map((s) => [s.name, `store.html?shot=${s.name}`]), ["promo tile (shown at 1280x800, the tile is the top-left 440x280)", "store.html?tile=small"]]
      .map(([label, src]) => `<figure><figcaption>${escape(label)}</figcaption><iframe src="${src}"></iframe></figure>`)
      .join("");
    document.body.append(sheet);
  }
</script>
</body>
</html>
